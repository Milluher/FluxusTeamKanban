# Runs on every pull request and every push to main.
#
# This exists because nothing did. Every check in this repo was run by hand,
# which is how a migration with the wrong ordering reached production behind a
# green build: the tests, the typecheck and the build all passed, and none of
# them was looking at migration order.
#
# Deliberately not here: replaying the migration history into an empty
# database. That is the strongest check available and it is the one that would
# have caught the PRD outage outright — but it cannot pass yet, because
# 20260515_sprint_status sorts before the migration that creates the table it
# alters. A check that is always red teaches people to ignore CI, so it stays
# out until that fault is fixed, and then it belongs here. Until then
# frontend/src/lib/migrationOrder.test.ts covers the same class of fault by
# reading the files, and runs as part of `npm test` below.
name: verify

on:
  pull_request:
  push:
    branches: [main]

# A second push to the same PR makes the first run irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend — tests, types, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails when the lockfile and package.json disagree, which is itself worth
      # catching — the PRD branch and main had conflicting dependency sets.
      - run: npm ci
        working-directory: frontend

      # Includes the migration-order guard, which reads
      # backend/prisma/migrations and needs no database.
      - run: npm test
        working-directory: frontend

      - run: npm run typecheck
        working-directory: frontend

      - run: npm run build
        working-directory: frontend
        env:
          # The build only needs this to be a valid URL; nothing is called at
          # build time.
          NEXT_PUBLIC_API_BASE_URL: https://example.invalid

  backend:
    name: backend — syntax and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        working-directory: backend

      # There are no backend tests yet. Until there are, these two catch the
      # classes of breakage that have actually happened here: a syntax error in
      # a route file, and a schema that does not parse.
      - name: Every source file parses
        run: find src -name '*.js' -print0 | xargs -0 -n1 node --check
        working-directory: backend

      - name: Prisma schema is valid
        run: npx prisma validate
        working-directory: backend
        env:
          # validate parses; it does not connect. A placeholder keeps it from
          # failing on a missing variable.
          DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
